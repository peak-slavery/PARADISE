<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Ei Point — control plane">
  <title>Ei Point</title>
  <defs>
    <linearGradient id="ep-logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- A node with a signal ring: the single point everything connects through -->
  <g transform="translate(4 8)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ep-logo-bg)"/>
    <circle cx="32" cy="32" r="15.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
    <circle cx="32" cy="32" r="8" fill="#FFFFFF"/>
  </g>

  <text x="82" y="52"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="34" letter-spacing="-0.8" fill="#0F172A">
    <tspan font-weight="800">Ei</tspan><tspan dx="7" font-weight="400" fill="#06B6D4">Point</tspan>
  </text>
</svg>
