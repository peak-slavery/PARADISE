# Render blueprint for the Ei Flow bot network.
#
# Architecture:
#   - The dashboard (Vercel) is the only host that ever holds vault-managed
#     secrets (MONGODB_URI, SUPABASE_*, UPSTASH_*, plus per-bot API keys).
#   - Each bot fetches its runtime secrets from the dashboard over an HMAC-
#     signed POST to /api/internal/secret/{name} on first boot and caches
#     them for 5 minutes (see packages/shared/src/vault-client.ts).
#   - The bot services below only need bootstrap-level credentials: the
#     Discord token, the bot id, the HMAC secret shared with the dashboard,
#     and the dashboard URL so the vault can be reached.
#   - Vault-managed secrets MUST NOT be added here. The `secret:` helper
#     rejects them at deploy time.
#
# Render free-tier note: persistent gateway bots will be throttled within
# hours. Run a paid instance type in production, or move the bot fleet to a
# host that does not idle-free (Railway, Fly.io, a small VM).
#
# Memory: free services get 512MB RAM each. NODE_OPTIONS caps the V8
# old-space heap at 384MB so a memory leak fails fast into Render's restart
# loop instead of silently growing into the platform OOM killer. Normal
# steady-state RSS is ~60-165MB, leaving ample headroom for non-heap memory.

# --- Reusable blocks ---------------------------------------------------------

x-bot-common: &bot-common
  runtime: node
  plan: free
  rootDir: .
  healthCheckPath: /health
  autoDeployTrigger: checksPass
  buildCommand: npm ci --include=dev

# --- Services ----------------------------------------------------------------

services:
  - name: eiflow-niko-robin
    <<: *bot-common
    startCommand: npm run start -w @eiflow/bot-niko-robin
    # Render replaces envVars arrays during YAML merges; keep common entries local.
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: BOT_VERSION
        value: '1.0.0'
      - key: OWNER_IDS
        sync: false
      - key: MONGODB_DB
        value: eiflow
      - key: MONGODB_SECONDARY_DB
        value: eipointsecurity
      - key: LOG_LEVEL
        value: info
      - key: REDIS_DAILY_COMMAND_BUDGET
        value: '8000'
      - key: DISCORD_TOKEN
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: DEV_GUILD_ID
        sync: false
      - key: MASTER_DISCORD_ID
        sync: false
      - key: MAIN_GUILD_ID
        sync: false
      - key: DEV_AUTH_CHANNEL_ID
        sync: false
      - key: HEALTH_TOKEN
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: BOT_ID
        value: niko-robin
      - key: BOT_NAME
        value: Niko Robin
      - key: EMBED_COLOR
        value: '#8E44AD'
      - key: DISCORD_CLIENT_ID
        value: '1479781452987109377'
      - key: MODELSCOPE_API_KEY
        sync: false
      - key: SEARCH_SLM_MODEL
        value: Qwen/Qwen3.5-35B-A3B
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false

