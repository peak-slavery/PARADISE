services:
  - type: web
    name: eiflow-niko-robin
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm ci
    startCommand: npm run start -w @eiflow/bot-niko-robin
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: BOT_ID
        value: niko-robin
      - key: BOT_NAME
        value: Niko Robin
      - key: BOT_VERSION
        value: 1.0.0
      - key: EMBED_COLOR
        value: '#8E44AD'
      - key: DISCORD_CLIENT_ID
        value: '1479781452987109377'
      - key: DISCORD_TOKEN
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: OWNER_IDS
        value: '1479589523426902208'
      - key: HEALTH_TOKEN
        generateValue: true
      - key: DASHBOARD_URL
        sync: false
      - key: DEV_GUILD_ID
        sync: false
      - key: MAIN_GUILD_ID
        sync: false
      - key: DEV_AUTH_CHANNEL_ID
        sync: false
      - key: MONGODB_DB
        value: eiflow
      - key: MONGODB_SECONDARY_DB
        value: eipointsecurity
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: '3000'
      - key: REDIS_DAILY_COMMAND_BUDGET
        value: '8000'

