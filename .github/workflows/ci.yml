name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Every bot is an isolated service, so typecheck them independently: a type
  # error in one bot must never block another from deploying.
  typecheck:
    name: typecheck shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @eiflow/shared

  typecheck-bots:
    name: typecheck ${{ matrix.bot }}
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        bot:
          - '@eiflow/bot-shanks'
          - '@eiflow/bot-sanji'
          - '@eiflow/bot-zoro'
          - '@eiflow/bot-boahancock'
          - '@eiflow/bot-nami'
          - '@eiflow/bot-luffy'
          - '@eiflow/bot-niko-robin'
          - '@eiflow/bot-cyrene'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w ${{ matrix.bot }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Blocks the merge on any high or critical advisory.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Card registry validation: scanner + manifest + probability contract.
  # Runs before the dashboard build so a bad card push fails fast and
  # never reaches the deployment artefact.
  cards:
    name: card registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fails on scanner errors, rarity-folder gaps, probability drift,
      # and any drift between the committed manifest and a fresh scan.
      - run: npm run cards:check -w @eiflow/bot-luffy
      # End-to-end card data path: manifest integrity, artwork containment,
      # the 100,000,000 weight total, Limited Arts at exactly 0.001%, and
      # agreement between the manifest and the runtime catalog the engine
      # actually draws from. Mongo parity is skipped here (no database).
      # LUFFY_SMOKE_REQUIRE_CATALOG makes a missing TS loader a hard failure
      # rather than a silent skip of the catalog check.
      - run: npm run smoke:luffy
        env:
          LUFFY_SMOKE_REQUIRE_CATALOG: '1'

  build-dashboard:
    name: build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `next build` generates next-env.d.ts as part of the build, which is why
      # the dashboard is built rather than only typechecked.
      - run: npm run build -w @eipoint/dashboard
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      # codeql-action reads the workflow run for status reporting; without
      # this it fails with "Resource not accessible by integration".
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: never

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for credential patterns
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks.toml is also auto-detected at the repo root; set it
          # explicitly so the job never silently runs with default rules only.
          GITLEAKS_CONFIG: gitleaks.toml
          # Pin the engine to the version the allowlist was validated against.
          GITLEAKS_VERSION: '8.30.1'

  production-smoke:
    name: production smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && vars.PRODUCTION_SMOKE_ENABLED == 'true'
    permissions:
      contents: read
    environment: production-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run smoke:production
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'eiflow' }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          HMAC_SECRETS_JSON: ${{ secrets.HMAC_SECRETS_JSON }}
          DASHBOARD_HEALTH_TOKEN: ${{ secrets.DASHBOARD_HEALTH_TOKEN }}
          EIFLOW_ENV: production
          BOT_HEALTH_TOKENS_JSON: ${{ secrets.BOT_HEALTH_TOKENS_JSON }}
          SMOKE_BOT_ID: ${{ vars.SMOKE_BOT_ID }}
          SHANKS_URL: ${{ vars.SHANKS_URL }}
          SANJI_URL: ${{ vars.SANJI_URL }}
          ZORO_URL: ${{ vars.ZORO_URL }}
          BOAHANCOCK_URL: ${{ vars.BOAHANCOCK_URL }}
          NAMI_URL: ${{ vars.NAMI_URL }}
          LUFFY_URL: ${{ vars.LUFFY_URL }}
          NIKO_ROBIN_URL: ${{ vars.NIKO_ROBIN_URL }}
          CYRENE_URL: ${{ vars.CYRENE_URL }}
