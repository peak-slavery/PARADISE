name: Free-tier quota report

# The whole architecture depends on staying under free-tier ceilings. Alert at
# 80% rather than discovering the ceiling when something breaks at 100%.
on:
  schedule:
    - cron: '0 9 * * 1' # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-tier-quota-and-retention
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect health + quota usage from all bots
        run: node scripts/quota-report.mjs
        env:
          BOT_HEALTH_URLS: ${{ secrets.BOT_HEALTH_URLS }}
          REDIS_DAILY_COMMAND_BUDGET: ${{ vars.REDIS_DAILY_COMMAND_BUDGET || '8000' }}
          DISCORD_REPORT_WEBHOOK: ${{ secrets.DISCORD_REPORT_WEBHOOK }}

  archive:
    name: Archive expired audit rows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Archive Supabase audit rows to MongoDB
        run: node scripts/archive-retention.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'eiflow' }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '90' }}
          RETENTION_BATCH_SIZE: ${{ vars.RETENTION_BATCH_SIZE || '250' }}
          RETENTION_MAX_ROWS: ${{ vars.RETENTION_MAX_ROWS || '10000' }}
