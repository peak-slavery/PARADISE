name: Release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: release validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w @eipoint/dashboard
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --audit-level=moderate
      - run: npm run check:deploy

  production-smoke:
    name: production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run smoke:production
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'eiflow' }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          HMAC_SECRETS_JSON: ${{ secrets.HMAC_SECRETS_JSON }}
          DASHBOARD_HEALTH_TOKEN: ${{ secrets.DASHBOARD_HEALTH_TOKEN }}
          EIFLOW_ENV: production
          BOT_HEALTH_TOKENS_JSON: ${{ secrets.BOT_HEALTH_TOKENS_JSON }}
          SMOKE_BOT_ID: ${{ vars.SMOKE_BOT_ID }}
          SHANKS_URL: ${{ vars.SHANKS_URL }}
          SANJI_URL: ${{ vars.SANJI_URL }}
          ZORO_URL: ${{ vars.ZORO_URL }}
          BOAHANCOCK_URL: ${{ vars.BOAHANCOCK_URL }}
          NAMI_URL: ${{ vars.NAMI_URL }}
          LUFFY_URL: ${{ vars.LUFFY_URL }}
          NIKO_ROBIN_URL: ${{ vars.NIKO_ROBIN_URL }}
          CYRENE_URL: ${{ vars.CYRENE_URL }}
