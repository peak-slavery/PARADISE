version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # Large framework/runtime upgrades need their own compatibility and
      # production smoke validation rather than an automatic weekly change.
      - dependency-name: next
        update-types: [version-update:ignore]
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(actions)
    labels: [dependencies]
