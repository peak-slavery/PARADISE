<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Paradise Engine system map</title>
  <desc id="desc">Three-dimensional style system map showing Discord bots, the shared runtime, the dashboard, and data services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1E293B"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .flow { stroke-dasharray: 10 14; animation: flow 2.5s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes flow { to { stroke-dashoffset:-48 } }
      @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }
      @media (prefers-reduced-motion: reduce) { .flow,.float { animation:none } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <g stroke="#94A3B8" stroke-opacity=".1"><path d="M0 350H1200"/><path d="M0 390H1200"/><path d="M150 0V420"/><path d="M300 0V420"/><path d="M450 0V420"/><path d="M600 0V420"/><path d="M750 0V420"/><path d="M900 0V420"/><path d="M1050 0V420"/></g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" opacity=".75" class="flow">
    <path d="M260 195H390"/><path d="M610 195H740"/><path d="M890 195H1000"/>
  </g>
  <g font-family="Inter,Segoe UI,system-ui,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 112)" class="float"><rect width="205" height="166" rx="20" fill="url(#card)" stroke="#475569"/><rect width="205" height="7" rx="3" fill="#5865F2"/><text x="24" y="48" fill="#F8FAFC" font-size="20" font-weight="700">DISCORD</text><text x="24" y="76" fill="#94A3B8" font-size="13">Guild events + commands</text><circle cx="31" cy="113" r="5" fill="#22D3EE"/><text x="45" y="118" fill="#CBD5E1" font-size="13">8 isolated bots</text><circle cx="31" cy="141" r="5" fill="#A78BFA"/><text x="45" y="146" fill="#CBD5E1" font-size="13">Permission gates</text></g>
    <g transform="translate(390 82)"><rect width="220" height="226" rx="22" fill="url(#card)" stroke="#7C3AED" stroke-opacity=".8"/><rect width="220" height="8" rx="4" fill="url(#accent)"/><text x="25" y="52" fill="#F8FAFC" font-size="20" font-weight="700">EI FLOW</text><text x="25" y="80" fill="#94A3B8" font-size="13">Shared runtime contract</text><path d="M25 112H195" stroke="#334155"/><text x="25" y="140" fill="#CBD5E1" font-size="13">Server lock</text><text x="25" y="166" fill="#CBD5E1" font-size="13">HMAC + replay guard</text><text x="25" y="192" fill="#CBD5E1" font-size="13">Queues + rate limits</text><text x="25" y="218" fill="#67E8F9" font-size="13">TLS + structured logs</text></g>
    <g transform="translate(740 112)" class="float"><rect width="205" height="166" rx="20" fill="url(#card)" stroke="#475569"/><rect width="205" height="7" rx="3" fill="#22D3EE"/><text x="24" y="48" fill="#F8FAFC" font-size="20" font-weight="700">EI POINT</text><text x="24" y="76" fill="#94A3B8" font-size="13">Authenticated dashboard</text><circle cx="31" cy="113" r="5" fill="#22D3EE"/><text x="45" y="118" fill="#CBD5E1" font-size="13">Guild configuration</text><circle cx="31" cy="141" r="5" fill="#A78BFA"/><text x="45" y="146" fill="#CBD5E1" font-size="13">Live audit stream</text></g>
    <g transform="translate(1000 95)"><rect width="150" height="210" rx="20" fill="url(#card)" stroke="#475569"/><text x="25" y="44" fill="#F8FAFC" font-size="18" font-weight="700">DATA</text><text x="25" y="78" fill="#CBD5E1" font-size="13">Supabase</text><text x="25" y="108" fill="#CBD5E1" font-size="13">MongoDB</text><text x="25" y="138" fill="#CBD5E1" font-size="13">Redis</text><path d="M25 162H125" stroke="#334155"/><text x="25" y="188" fill="#67E8F9" font-size="12">RLS • TLS • TTL</text></g>
  </g>
  <text x="600" y="365" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">EVENTS → CONTROLS → STATE → OBSERVABILITY</text>
</svg>
